  - title: RuleCompass(내규·외규 정합성 점검 시스템)
    time: 2026.08 ~ 2026.10
    company: 삼정KPMG 회계법인
    skills: FastAPI, Celery, Redis, PostgreSQL, pgvector, Next.js, TypeScript, Tailwind CSS, vLLM, Qwen3.5, LibreOffice, Docker Compose, Playwright
    images:
      - projects/architecture/rulecompass_architecture.png
      - projects/rulecompass_1.jpeg
      - projects/rulecompass_2.jpeg
      - projects/rulecompass_3.jpeg
    details: |
      법령·행정규칙·자율규제 등 외부 규범을 수집하고, 금융기관 내규가 외규의 요구사항을 반영하고 있는지 LLM으로 판정해 점검 보고서까지 생성하는 규제 준수 점검 시스템 개발
        - 📊 성과 :
          - 국가법령정보 OPEN API 기반으로 법령 5,600여 건·행정규칙 24,600여 건(조문 74만 건)을 조문 단위로 구조화하고 증분 동기화 체계 구축
          - 조문 청크 39만 건을 임베딩해 형태소 분석과 벡터 검색을 결합한 하이브리드 조문 검색 구현(PostgreSQL + pgvector)
          - 내규 문서(PDF/HWP)를 자동 변환·조문 분할하고 외규 인용·위임 관계를 자동 연결
          - 점검 대상 선정 → 요구사항 도출 → 정합성 판정으로 이어지는 AI 점검 파이프라인을 화면에서 버튼 하나로 실행, 조문 13만 건·LLM 호출 15만 회 규모 배치를 체크포인트 기반으로 중단 없이 처리
          - AI 판정은 후보로 제시하고 담당자가 검토·확정하는 Human-in-the-Loop 구조, 프롬프트 버전과 LLM 호출 로그를 보관해 판정 근거 추적
          - 정합성 점검 결과 보고서(Word/PDF) 자동 생성, 요구사항·판정 결과 Excel 다운로드, ReAct 기반 조문 검색 AI Agent 제공
          - 폐쇄망 환경 배포를 위한 오프라인 설치 번들(컨테이너 이미지·DB 덤프·소스) 생성/복원 절차 구축
        - 👨🏻‍💻 Role : 풀스택 /1명
          - 시스템·소프트웨어 아키텍처, 데이터 모델 및 4단계 점검 프로세스 설계
          - 법제처 OPEN API 동기화, 문서 변환(LibreOffice·PDF→Markdown) 및 조문 분할 파이프라인 개발
          - LLM 판정 파이프라인(규정 적용 판단, 요구사항 추출, 정합성 판정)과 프롬프트·모델 프로필 관리 기능 개발
          - FastAPI 백엔드 API, Celery 기반 배치 실행, Next.js 업무 화면(목록 필터/정렬, 담당자 확정·수정, Excel) 개발
          - 보고서 생성(python-docx, matplotlib) 및 조문 검색 AI Agent 개발
          - Docker Compose 배포 구성 및 폐쇄망 오프라인 번들 구축
