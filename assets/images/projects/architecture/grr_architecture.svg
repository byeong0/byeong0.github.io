<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#ffffff;font-family:'Helvetica Neue',Helvetica,'Apple SD Gothic Neo',Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img"
     aria-label="GRR 국가위험평가 시스템 아키텍처: 20개 국가위험 데이터셋 수집, PostgreSQL 저장, 국가 매칭과 위험 등급 산정, LLM 미매핑 국가 추천, 대시보드·Excel·이메일 산출">
  <style>
  .t { font-size: 16px; font-weight: 700; fill: #000; }
  .b { font-size: 12.5px; fill: #000; }
  .l { font-size: 12.5px; fill: #000; }
  .box { stroke-width: 1.5; }
  .arrow { stroke: #000; stroke-width: 2; fill: none; }  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 국가위험 데이터 소스 -->
  <rect class="box" x="40" y="40" width="320" height="140" rx="14" fill="#f5f5f5" stroke="#666666"/>
  <text class="t" x="200" y="68" text-anchor="middle">국가위험 데이터 소스</text>
  <text class="b" x="200" y="94" text-anchor="middle">FATF · EU · INCSR · FinCEN · OFAC</text>
  <text class="b" x="200" y="114" text-anchor="middle">UN · OECD · World Bank 등 20개 데이터셋</text>
  <text class="b" x="200" y="134" text-anchor="middle">공개 자료 (PDF / Excel / HTML)</text>
  <text class="b" x="200" y="154" text-anchor="middle">ISO 3166 국가 마스터 · 기준 파일</text>

  <!-- 1. 수집 -->
  <rect class="box" x="40" y="270" width="320" height="150" rx="14" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="t" x="200" y="300" text-anchor="middle">1. 수집 (크롤러)</text>
  <text class="b" x="200" y="328" text-anchor="middle">Playwright · Cheerio · pdf-parse</text>
  <text class="b" x="200" y="348" text-anchor="middle">데이터셋별 수집기 · 기준일자 / 수집일자 관리</text>
  <text class="b" x="200" y="368" text-anchor="middle">원천 링크 · 수집 이력 관리</text>
  <text class="b" x="200" y="388" text-anchor="middle">수집 진행 상황 실시간 스트리밍 (NDJSON)</text>

  <!-- DB 원통 -->
  <path class="box" d="M440,268 A110,18 0 0 0 660,268 L660,442 A110,18 0 0 1 440,442 Z" fill="#f8cecc" stroke="#b85450"/>
  <ellipse class="box" cx="550" cy="268" rx="110" ry="18" fill="#f8cecc" stroke="#b85450"/>
  <text class="t" x="550" y="312" text-anchor="middle">PostgreSQL</text>
  <text class="b" x="550" y="338" text-anchor="middle">국가 마스터 · 국가명 alias</text>
  <text class="b" x="550" y="358" text-anchor="middle">데이터셋 카탈로그 · 원천 데이터</text>
  <text class="b" x="550" y="378" text-anchor="middle">FATF 점수 · FinCEN 매핑</text>
  <text class="b" x="550" y="398" text-anchor="middle">국가별 위험 등급 · 보정 이력</text>
  <text class="b" x="550" y="418" text-anchor="middle">사용자 · 이메일 발송 설정</text>

  <!-- Runtime / Deployment -->
  <rect class="box" x="740" y="40" width="320" height="110" rx="14" fill="#edf4f7" stroke="#91aeba"/>
  <text class="t" x="900" y="68" text-anchor="middle">Runtime / Deployment</text>
  <text class="b" x="900" y="94" text-anchor="middle">Next.js (Node.js) 컨테이너 서비스</text>
  <text class="b" x="900" y="114" text-anchor="middle">PostgreSQL 기반 운영 데이터 관리</text>
  <text class="b" x="900" y="134" text-anchor="middle">예약 작업 · 이메일 예약 발송</text>

  <!-- 2~3단계 -->
  <rect class="box" x="740" y="200" width="320" height="100" rx="14" fill="#fff2cc" stroke="#d6b656"/>
  <text class="t" x="900" y="230" text-anchor="middle">2. 표준화 · 국가 매칭</text>
  <text class="b" x="900" y="256" text-anchor="middle">ISO 3166 국가 마스터 / alias 기반 국가명 매칭</text>
  <text class="b" x="900" y="276" text-anchor="middle">미매핑 국가 → LLM ISO 코드 추천 → 담당자 확정</text>

  <rect class="box" x="740" y="335" width="320" height="100" rx="14" fill="#fff2cc" stroke="#d6b656"/>
  <text class="t" x="900" y="365" text-anchor="middle">3. 위험 등급 산정 · 보정</text>
  <text class="b" x="900" y="391" text-anchor="middle">FATF 상호평가(R.1~R.40) · FinCEN finding 매핑</text>
  <text class="b" x="900" y="411" text-anchor="middle">N/A 국가 제외 · 수동 보정 → GRR Final Results</text>

  <!-- LLM -->
  <rect class="box" x="1180" y="200" width="200" height="205" rx="14" fill="#e6d0de" stroke="#9673a6"/>
  <text class="t" x="1280" y="232" text-anchor="middle">LLM</text>
  <text class="b" x="1280" y="262" text-anchor="middle">vLLM · Azure OpenAI</text>
  <text class="b" x="1280" y="300" text-anchor="middle">미매핑 국가명 →</text>
  <text class="b" x="1280" y="320" text-anchor="middle">ISO 코드 후보 추천</text>
  <text class="b" x="1280" y="358" text-anchor="middle">후보 제시 → 담당자 검토 · 확정</text>
  <text class="b" x="1280" y="378" text-anchor="middle">(Human-in-the-Loop)</text>

  <!-- 사용자 -->
  <rect class="box" x="40" y="620" width="320" height="140" rx="14" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="t" x="200" y="650" text-anchor="middle">AML · 국가위험 평가 담당자</text>
  <text class="b" x="200" y="678" text-anchor="middle">데이터셋 수집 현황 · 원천 확인</text>
  <text class="b" x="200" y="698" text-anchor="middle">미매핑 국가 검토 · 위험 점수 보정</text>
  <text class="b" x="200" y="718" text-anchor="middle">N/A 국가 제외 관리</text>
  <text class="b" x="200" y="738" text-anchor="middle">대시보드 · Excel · 이메일 수신</text>

  <!-- 웹 애플리케이션 -->
  <rect class="box" x="430" y="620" width="300" height="140" rx="14" fill="#e1f5e7" stroke="#82b366"/>
  <text class="t" x="580" y="650" text-anchor="middle">웹 애플리케이션</text>
  <text class="b" x="580" y="678" text-anchor="middle">Next.js App Router (화면 + API Route)</text>
  <text class="b" x="580" y="698" text-anchor="middle">React · TypeScript · Ant Design · Tailwind</text>
  <text class="b" x="580" y="718" text-anchor="middle">수집 실행 · 진행 상황 스트리밍</text>
  <text class="b" x="580" y="738" text-anchor="middle">가입 승인 · 계정/IP 로그인 실패 제한</text>

  <!-- 산출물 -->
  <rect class="box" x="800" y="620" width="260" height="140" rx="14" fill="#d5e8d4" stroke="#82b366"/>
  <text class="t" x="930" y="650" text-anchor="middle">산출물</text>
  <text class="b" x="930" y="678" text-anchor="middle">국가위험 지도 · 대시보드</text>
  <text class="b" x="930" y="698" text-anchor="middle">전체 / 개별 Excel (ExcelJS)</text>
  <text class="b" x="930" y="718" text-anchor="middle">이메일 발송 · 예약 발송</text>
  <text class="b" x="930" y="738" text-anchor="middle">(Azure Communication Services)</text>

  <!-- 화살표 -->
  <line class="arrow" x1="200" y1="180" x2="200" y2="270" marker-end="url(#arrow)"/>
  <text class="l" x="212" y="230">수집 · 기준일자 갱신</text>

  <line class="arrow" x1="360" y1="345" x2="440" y2="345" marker-end="url(#arrow)"/>
  <text class="l" x="400" y="336" text-anchor="middle">저장</text>

  <line class="arrow" x1="660" y1="280" x2="740" y2="280" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="700" y="270" text-anchor="middle">조회 / 저장</text>

  <line class="arrow" x1="660" y1="400" x2="740" y2="400" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="700" y="390" text-anchor="middle">조회 / 저장</text>

  <line class="arrow" x1="900" y1="300" x2="900" y2="335" marker-end="url(#arrow)"/>
  <text class="l" x="910" y="323">표준화된 국가 데이터</text>

  <line class="arrow" x1="1060" y1="250" x2="1180" y2="250" marker-end="url(#arrow)"/>
  <text class="l" x="1120" y="241" text-anchor="middle">미매핑 국가 추천</text>

  <line class="arrow" x1="930" y1="435" x2="930" y2="620" marker-end="url(#arrow)"/>
  <text class="l" x="942" y="530">GRR Final Results</text>

  <line class="arrow" x1="580" y1="620" x2="580" y2="460" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="592" y="545">조회 · 보정 · 설정</text>

  <line class="arrow" x1="470" y1="620" x2="320" y2="420" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="372" y="512" text-anchor="end">수집 실행 /</text>
  <text class="l" x="372" y="530" text-anchor="end">진행 스트리밍 (NDJSON)</text>

  <line class="arrow" x1="360" y1="690" x2="430" y2="690" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="395" y="680" text-anchor="middle">사용</text>

  <line class="arrow" x1="800" y1="720" x2="730" y2="720" marker-end="url(#arrow)"/>
  <text class="l" x="765" y="711" text-anchor="middle">다운로드</text>
</svg>
