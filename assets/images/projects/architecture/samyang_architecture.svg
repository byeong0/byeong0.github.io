<?xml version="1.0" encoding="UTF-8"?>
<svg style="background:#ffffff;font-family:'Helvetica Neue',Helvetica,'Apple SD Gothic Neo',Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img"
     aria-label="패키징 도안 AI 일치검사 파이프라인: 의뢰서와 도안의 멀티모달 추출, 정규화 전처리, GPT 기반 항목 매핑과 3단계 검수, 신뢰도 기반 Human-in-the-Loop 판정">
  <style>
  .t { font-size: 16px; font-weight: 700; fill: #000; }
  .s { font-size: 14px; font-weight: 700; fill: #000; }
  .b { font-size: 12.5px; fill: #000; }
  .l { font-size: 12.5px; fill: #000; }
  .acc { font-size: 13px; font-weight: 700; fill: #b85450; }
  .box { stroke-width: 1.5; }
  .arrow { stroke: #000; stroke-width: 2; fill: none; }  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 입력 -->
  <rect class="box" x="260" y="40" width="300" height="100" rx="14" fill="#f5f5f5" stroke="#666666"/>
  <text class="t" x="410" y="70" text-anchor="middle">표시사항 의뢰서</text>
  <text class="b" x="410" y="96" text-anchor="middle">Excel / Adobe Illustrator(.ai)</text>
  <text class="b" x="410" y="116" text-anchor="middle">원재료명 · 영양성분 · 법적 필수 표기사항</text>

  <rect class="box" x="760" y="40" width="300" height="100" rx="14" fill="#f5f5f5" stroke="#666666"/>
  <text class="t" x="910" y="70" text-anchor="middle">패키징 디자인 도안</text>
  <text class="b" x="910" y="96" text-anchor="middle">PDF / 고해상도 이미지 (신규 · 이전 버전)</text>
  <text class="b" x="910" y="116" text-anchor="middle">곡면 · 장식 폰트 · 인증마크 · 로고</text>

  <!-- 멀티모달 추출 -->
  <rect class="box" x="100" y="220" width="270" height="100" rx="14" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="s" x="235" y="250" text-anchor="middle">Excel 파서</text>
  <text class="b" x="235" y="276" text-anchor="middle">구조화 테이블 · 항목 추출</text>
  <text class="b" x="235" y="296" text-anchor="middle">Key-Value 정리</text>

  <rect class="box" x="410" y="220" width="270" height="100" rx="14" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="s" x="545" y="250" text-anchor="middle">Azure Document Intelligence</text>
  <text class="b" x="545" y="276" text-anchor="middle">레이아웃 분석 · 비정형 텍스트 추출</text>
  <text class="b" x="545" y="296" text-anchor="middle">영역별 구조 메타데이터</text>

  <rect class="box" x="720" y="220" width="270" height="100" rx="14" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="s" x="855" y="250" text-anchor="middle">PyMuPDF + OCR / 텍스트 스포팅</text>
  <text class="b" x="855" y="276" text-anchor="middle">벡터 텍스트 · 위치 좌표 추출</text>
  <text class="b" x="855" y="296" text-anchor="middle">아웃라인 · 곡면 · 특수 폰트 영역 보완</text>

  <rect class="box" x="1030" y="220" width="270" height="100" rx="14" fill="#ffe6cc" stroke="#d79b00"/>
  <text class="s" x="1165" y="250" text-anchor="middle">Azure Custom Vision</text>
  <text class="b" x="1165" y="276" text-anchor="middle">인증마크 · 로고 · 특수 심볼 탐지</text>
  <text class="b" x="1165" y="296" text-anchor="middle">객체 위치와 종류 식별</text>

  <!-- 정규화 전·후처리 -->
  <rect class="box" x="100" y="400" width="1200" height="90" rx="14" fill="#fff2cc" stroke="#d6b656"/>
  <text class="t" x="700" y="430" text-anchor="middle">도메인 특화 정규화 사전 · 전후처리</text>
  <text class="b" x="700" y="456" text-anchor="middle">단위 (g · mg · kcal · %) · 특수기호 · 원재료명 오타 패턴 보정 · 다국어 Unicode / 공백 정규화 · 줄바꿈 단어 끊김 복원 · 레이아웃 블록 단위 그루핑</text>
  <text class="b" x="700" y="476" text-anchor="middle">OCR 오인식 교정 사전 적용 → LLM 입력 전 데이터 품질 정제 → 오탐지(False Positive) 감소</text>

  <!-- GPT 매핑 -->
  <rect class="box" x="100" y="570" width="440" height="120" rx="14" fill="#e6d0de" stroke="#9673a6"/>
  <text class="t" x="320" y="600" text-anchor="middle">Azure OpenAI (GPT-5) 의미 기반 항목 매핑</text>
  <text class="b" x="320" y="626" text-anchor="middle">의뢰서 항목 ↔ 도안 텍스트 블록 · 인증마크 1:1 / 1:N 매핑</text>
  <text class="b" x="320" y="646" text-anchor="middle">어순 변경 · 표기 방식 차이 · 파편화된 텍스트를 문맥으로 복원</text>
  <text class="b" x="320" y="666" text-anchor="middle">단순 문자열 비교로 불가능한 의미 일치 판별 · Structured Output(JSON)</text>

  <!-- 3단계 검수 -->
  <rect class="box" x="620" y="570" width="210" height="120" rx="14" fill="#e1f5e7" stroke="#82b366"/>
  <text class="s" x="725" y="600" text-anchor="middle">① 서식 검수</text>
  <text class="b" x="725" y="626" text-anchor="middle">제품 분류별 필수 표기 항목</text>
  <text class="b" x="725" y="646" text-anchor="middle">필수 인증마크 누락 검증</text>

  <rect class="box" x="855" y="570" width="210" height="120" rx="14" fill="#e1f5e7" stroke="#82b366"/>
  <text class="s" x="960" y="600" text-anchor="middle">② 의뢰서 · 도안 일치검사</text>
  <text class="b" x="960" y="626" text-anchor="middle">텍스트 오탈자 · 영양성분 수치</text>
  <text class="b" x="960" y="646" text-anchor="middle">인증마크 불일치 판별</text>

  <rect class="box" x="1090" y="570" width="210" height="120" rx="14" fill="#e1f5e7" stroke="#82b366"/>
  <text class="s" x="1195" y="600" text-anchor="middle">③ 시안 간 차이 식별</text>
  <text class="b" x="1195" y="626" text-anchor="middle">개정 전후 도안 비교</text>
  <text class="b" x="1195" y="646" text-anchor="middle">의도치 않은 변경 · 누락 탐지</text>

  <!-- HITL 판정 -->
  <rect class="box" x="100" y="760" width="640" height="130" rx="14" fill="#dae8fc" stroke="#6c8ebf"/>
  <text class="t" x="420" y="790" text-anchor="middle">신뢰도(Confidence Score) 기반 판정 · Human-in-the-Loop</text>
  <text class="b" x="420" y="816" text-anchor="middle">직접 추출 텍스트 영역과 OCR 영역의 판정 신뢰도를 구분해 임계치 적용</text>
  <text class="b" x="420" y="836" text-anchor="middle">임계치 이상 완전 일치 → 자동 승인</text>
  <text class="b" x="420" y="856" text-anchor="middle">불일치 · 저신뢰 항목 → 도안 위 좌표(Bounding Box) 하이라이팅과 함께 검수자에게 우선 전달</text>
  <text class="b" x="420" y="876" text-anchor="middle">검수자 확정 → 심의 결과 반영</text>

  <!-- 산출물 / 백엔드 -->
  <rect class="box" x="820" y="760" width="480" height="130" rx="14" fill="#d5e8d4" stroke="#82b366"/>
  <text class="t" x="1060" y="790" text-anchor="middle">심의 리포트 · 백엔드 플랫폼 · 품질 평가</text>
  <text class="b" x="1060" y="816" text-anchor="middle">최종 심의 리포트 생성 · DB 적재 · 검수자 화면 제공</text>
  <text class="b" x="1060" y="836" text-anchor="middle">Python · FastAPI · 비동기 처리 파이프라인</text>
  <text class="b" x="1060" y="856" text-anchor="middle">대용량 도안 전처리 · 다중 AI 모델 호출 병목 제어</text>
  <text class="b" x="1060" y="876" text-anchor="middle">정답 데이터 기반 Precision · Recall · F1 평가 · 정상 / 노이즈 테스트셋</text>

  <!-- 아키텍트 투입 범위 (정확도 개선) -->
  <rect x="86" y="386" width="1228" height="518" rx="18" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="9,6"/>
  <text class="acc" x="1300" y="378" text-anchor="end">아키텍트 투입 범위: 정확도 개선 (정규화 · 매핑 · 신뢰도 기반 판정)</text>

  <!-- 화살표: 입력 → 추출 -->
  <line class="arrow" x1="340" y1="140" x2="250" y2="220" marker-end="url(#arrow)"/>
  <text class="l" x="262" y="186" text-anchor="end">Excel</text>
  <line class="arrow" x1="480" y1="140" x2="530" y2="220" marker-end="url(#arrow)"/>
  <text class="l" x="520" y="186">.ai</text>
  <line class="arrow" x1="880" y1="140" x2="860" y2="220" marker-end="url(#arrow)"/>
  <text class="l" x="858" y="186" text-anchor="end">텍스트 레이어 · 이미지</text>
  <line class="arrow" x1="990" y1="140" x2="1140" y2="220" marker-end="url(#arrow)"/>
  <text class="l" x="1080" y="186">시각 객체</text>

  <!-- 추출 → 정규화 -->
  <line class="arrow" x1="235" y1="320" x2="235" y2="400" marker-end="url(#arrow)"/>
  <line class="arrow" x1="545" y1="320" x2="545" y2="400" marker-end="url(#arrow)"/>
  <line class="arrow" x1="855" y1="320" x2="855" y2="400" marker-end="url(#arrow)"/>
  <line class="arrow" x1="1165" y1="320" x2="1165" y2="400" marker-end="url(#arrow)"/>
  <text class="l" x="700" y="365" text-anchor="middle">추출 텍스트 · 좌표 · 인증마크 통합</text>

  <!-- 정규화 → 매핑 -->
  <line class="arrow" x1="320" y1="490" x2="320" y2="570" marker-end="url(#arrow)"/>
  <text class="l" x="332" y="536">정제된 항목 · 텍스트 블록</text>

  <!-- 매핑 → 3단계 검수 -->
  <line class="arrow" x1="540" y1="630" x2="620" y2="630" marker-end="url(#arrow)"/>
  <text class="l" x="580" y="620" text-anchor="middle">매핑 결과</text>
  <line class="arrow" x1="830" y1="630" x2="855" y2="630" marker-end="url(#arrow)"/>
  <line class="arrow" x1="1065" y1="630" x2="1090" y2="630" marker-end="url(#arrow)"/>

  <!-- 3단계 검수 → HITL -->
  <line class="arrow" x1="960" y1="690" x2="560" y2="760" marker-end="url(#arrow)"/>
  <text class="l" x="790" y="740" text-anchor="middle">① ② ③ 판별 결과 + 신뢰도 점수</text>

  <!-- HITL → 산출물 -->
  <line class="arrow" x1="740" y1="815" x2="820" y2="815" marker-end="url(#arrow)"/>
  <text class="l" x="780" y="806" text-anchor="middle">판정</text>
</svg>
